<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./calculator.css" />
  </head>
  <body>
    <h1>My Calculator App</h1>
    <div class="container">
      <div id="display"></div>
      <hr />
      <div class="btn_areas">
        <button id="clean" class="btn opi">C</button>
        <button class="btn operator opi">%</button>
        <button class="btn operator opi">**</button>
        <button class="btn operator opa">/</button>
        <button class="btn operand">7</button>
        <button class="btn operand">8</button>
        <button class="btn operand">9</button>

        <button class="btn operator opa">*</button>

        <button class="btn operand">6</button>
        <button class="btn operand">5</button>
        <button class="btn operand">4</button>

        <button class="btn operator opa">-</button>

        <button class="btn operand">3</button
        ><button class="btn operand">2</button>
        <button class="btn operand">1</button>

        <button class="btn operator opa">+</button>
        <button class="btn deleteLast">></button
        ><button class="btn operand">0</button>

        <button class="btn operator">.</button
        ><button id="equal" class="btn equal op">=</button>
      </div>
    </div>
    <script src="./calculator.js"></script>
  </body>
</html>
